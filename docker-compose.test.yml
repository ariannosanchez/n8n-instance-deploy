# Prueba LOCAL del stack (no se usa en Railway).
#   docker compose -f docker-compose.test.yml up -d --build
#   docker stats --no-stream
#   docker compose -f docker-compose.test.yml down -v
# Los volumenes se montan igual que en Railway (propiedad de root) para validar permisos.
services:
  postgres:
    build: ./postgres
    environment:
      POSTGRES_USER: n8n
      POSTGRES_DB: n8n
      POSTGRES_PASSWORD: test_pg_pass
    volumes:
      - pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U n8n -d n8n"]
      interval: 3s
      retries: 20

  redis:
    build: ./redis
    environment:
      REDIS_PASSWORD: test_redis_pass
    volumes:
      - redis_data:/data

  n8n:
    build:
      context: ./n8n
      args:
        N8N_VERSION: ${N8N_VERSION:-stable}
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "5678:5678"
    environment:
      N8N_ENCRYPTION_KEY: test_key_solo_local_0123456789abcdef
      DB_POSTGRESDB_HOST: postgres
      DB_POSTGRESDB_PORT: "5432"
      DB_POSTGRESDB_DATABASE: n8n
      DB_POSTGRESDB_USER: n8n
      DB_POSTGRESDB_PASSWORD: test_pg_pass
      # Solo para local (sin HTTPS):
      N8N_PROTOCOL: http
      N8N_SECURE_COOKIE: "false"
      N8N_HOST: localhost
      WEBHOOK_URL: http://localhost:5678/
    volumes:
      - n8n_data:/home/node/.n8n

volumes:
  pg_data:
  redis_data:
  n8n_data:
